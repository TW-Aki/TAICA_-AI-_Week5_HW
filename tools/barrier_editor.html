const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const CX = 450, CY = 350;

// 預設：三頂點 + 兩內圈
// 四角錐：正方形底 4 點 + 1 個頂點（共 5 個頂點）
let tri = [
  {x: CX,     y: CY-95},    // 底 B1（後）
  {x: CX+150, y: CY+10},    // 底 B2（右）
  {x: CX,     y: CY+120},   // 底 B3（前）
  {x: CX-150, y: CY+10}     // 底 B4（左）
];
let poles = [
  {x: CX, y: CY-235}        // 頂點 Apex
];
let fins = [
  {x: CX,     y: CY-95,  ang: -Math.PI/2,   sc: 0.8,  kind:'wide'},
  {x: CX+150, y: CY+10,  ang:  0,           sc: 0.9,  kind:'narrow'},
  {x: CX,     y: CY+120, ang:  Math.PI/2,   sc: 0.8,  kind:'wide'},
  {x: CX-150, y: CY+10,  ang:  Math.PI,     sc: 0.9,  kind:'narrow'},
  {x: CX,     y: CY-235, ang: -Math.PI/2,   sc: 0.62, kind:'wide'}
];

let sel = -1, drag = null;  // {type:'fin'|'tri', i, mode:'move'|'rot'}

function draw(){
  // 棋盤背景（方便看清深色感應炮）
  const cell = 40;
  for (let y=0;y<cv.height;y+=cell){
    for (let x=0;x<cv.width;x+=cell){
      ctx.fillStyle = ((x/cell + y/cell) % 2 === 0) ? '#8f98a6' : '#a4adb9';
      ctx.fillRect(x, y, cell, cell);
    }
  }
  // 背景網格
  ctx.strokeStyle = 'rgba(40,50,60,0.12)'; ctx.lineWidth = 1;
  for (let x=0;x<cv.width;x+=50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke(); }
  for (let y=0;y<cv.height;y+=50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke(); }

  // 三角面
  const g = ctx.createRadialGradient(CX,CY,10,CX,CY,260);
  g.addColorStop(0,'rgba(255,150,225,0.05)');
  g.addColorStop(0.7,'rgba(255,110,200,0.12)');
  g.addColorStop(1,'rgba(255,90,190,0)');
  ctx.beginPath();
  ctx.moveTo(tri[0].x,tri[0].y);
  for (let i=1;i<tri.length;i++) ctx.lineTo(tri[i].x,tri[i].y);
  ctx.closePath(); ctx.fillStyle = g; ctx.fill();

  // 底部光束邊（正方形四邊）
  for (let k=0;k<tri.length;k++){
    const a = tri[k], b = tri[(k+1)%tri.length];
    ctx.strokeStyle = 'rgba(255,190,235,0.9)';
    ctx.lineWidth = 9; ctx.shadowColor = '#ff7ad9'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }

  // 感應炮
  fins.forEach((f, i) => {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.ang + Math.PI/2);
    const img = f.kind === 'narrow' ? FIN_N : FIN;
    if (img.complete){
      const fh = 96 * f.sc, fw = fh * img.naturalWidth / img.naturalHeight;
      ctx.drawImage(img, -fw/2, -fh*0.42, fw, fh);
    }
    ctx.restore();
    // 旋轉把手
    const hx = f.x + Math.cos(f.ang)*70, hy = f.y + Math.sin(f.ang)*70;
    ctx.strokeStyle = i===sel ? 'rgba(255,217,61,0.9)' : 'rgba(255,217,61,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.fillStyle = i===sel ? '#ffd93d' : 'rgba(255,217,61,0.55)';
    ctx.beginPath(); ctx.arc(hx,hy, i===sel?7:5, 0, Math.PI*2); ctx.fill();
    if (i===sel){
      ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x,f.y,26,0,Math.PI*2); ctx.stroke();
    }
  });

  // 上下極點
  poles.forEach((p, i) => {
    ctx.fillStyle = '#4fb8ff';
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#1565c0'; ctx.font = 'bold 12px system-ui';
    ctx.fillText('Apex 頂點', p.x+12, p.y-10);
    // 連到赤道三點（立體感）
    tri.forEach(q => {
      ctx.strokeStyle = 'rgba(120,200,255,0.18)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    });
  });

  // 三角頂點
  tri.forEach((p, i) => {
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#c0392b'; ctx.font = 'bold 12px system-ui';
    ctx.fillText('B'+(i+1), p.x+12, p.y-10);
  });

  // 中心十字
  ctx.strokeStyle = 'rgba(30,60,100,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX-14,CY); ctx.lineTo(CX+14,CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX,CY-14); ctx.lineTo(CX,CY+14); ctx.stroke();

  document.getElementById('sel').textContent = sel>=0 ? ('#'+(sel+1)) : '無';
  document.getElementById('ang').textContent = sel>=0 ? Math.round(fins[sel].ang*180/Math.PI)+'°' : '-';
  document.getElementById('scl').textContent = sel>=0 ? fins[sel].sc.toFixed(2) : '-';
}

function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX-r.left) * cv.width/r.width, y: (e.clientY-r.top) * cv.height/r.height };
}
cv.addEventListener('mousedown', e => {
  const p = pos(e);
  // 三角頂點優先
  for (let i=0;i<tri.length;i++){
    if (Math.hypot(tri[i].x-p.x, tri[i].y-p.y) < 16){ drag={type:'tri', i}; return; }
  }
  for (let i=0;i<poles.length;i++){
    if (Math.hypot(poles[i].x-p.x, poles[i].y-p.y) < 16){ drag={type:'pole', i}; return; }
  }
  // 旋轉把手
  for (let i=0;i<fins.length;i++){
    const f = fins[i];
    const hx = f.x + Math.cos(f.ang)*70, hy = f.y + Math.sin(f.ang)*70;
    if (Math.hypot(hx-p.x, hy-p.y) < 14){ sel=i; drag={type:'fin', i, mode:'rot'}; draw(); return; }
  }
  // 感應炮本體
  for (let i=fins.length-1;i>=0;i--){
    const f = fins[i];
    if (Math.hypot(f.x-p.x, f.y-p.y) < 34){ sel=i; drag={type:'fin', i, mode:'move'}; draw(); return; }
  }
  sel = -1; drag = null; draw();
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const p = pos(e);
  if (drag.type === 'tri'){ tri[drag.i].x = p.x; tri[drag.i].y = p.y; }
  else if (drag.type === 'pole'){ poles[drag.i].x = p.x; poles[drag.i].y = p.y; }
  else {
    const f = fins[drag.i];
    if (drag.mode === 'move'){ f.x = p.x; f.y = p.y; }
    else { f.ang = Math.atan2(p.y-f.y, p.x-f.x); }
  }
  draw();
});
window.addEventListener('mouseup', ()=>{ drag = null; });
cv.addEventListener('wheel', e => {
  if (sel < 0) return;
  e.preventDefault();
  fins[sel].sc = Math.max(0.25, Math.min(2, fins[sel].sc + (e.deltaY>0 ? -0.05 : 0.05)));
  draw();
}, {passive:false});
document.getElementById('btnReset').onclick = () => location.reload();
document.getElementById('btnCopy').onclick = () => {
  const data = {
    tri: tri.map(p => ({x: Math.round(p.x-CX), y: Math.round(p.y-CY)})),
    poles: poles.map(p => ({x: Math.round(p.x-CX), y: Math.round(p.y-CY)})),
    fins: fins.map(f => ({x: Math.round(f.x-CX), y: Math.round(f.y-CY), ang: +(f.ang).toFixed(3), sc: +f.sc.toFixed(2), kind: f.kind}))
  };
  const ta = document.getElementById('out');
  ta.value = JSON.stringify(data);
  ta.select(); try{ document.execCommand('copy'); }catch(err){}
};
draw();
</script></body></html>
