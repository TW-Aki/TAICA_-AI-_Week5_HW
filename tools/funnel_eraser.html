<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>感應炮擦除工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#c8d6e5;font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;display:flex;height:100vh}
#left{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#12161f}
#right{width:280px;border-left:1px solid #1e2a3a;padding:16px;font-size:13px;display:flex;flex-direction:column;gap:10px}
h1{font-size:15px;color:#7fd4ff;margin:0}
.hint{color:#6b8199;font-size:12px;line-height:1.7}
button{background:#1b2a3c;color:#9fd0f0;border:1px solid #2b4056;padding:8px;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#24405c}
button.on{background:#2b5a8a;border-color:#4fb8ff}
.row{display:flex;gap:8px}
canvas{cursor:crosshair;background:
  linear-gradient(45deg,#1a1f2a 25%,transparent 25%),linear-gradient(-45deg,#1a1f2a 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#1a1f2a 75%),linear-gradient(-45deg,transparent 75%,#1a1f2a 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
input[type=range]{width:100%}
</style></head><body>
<div id="left"><canvas id="cv"></canvas></div>
<div id="right">
  <h1>感應炮擦除</h1>
  <div class="hint">選部件 → 在畫面上拖曳擦掉肩上的 3 枚感應炮 → 下載 PNG。<br>（右鍵或按住 Shift 可還原）</div>
  <div class="row">
    <button id="b8" class="on">g08</button>
    <button id="b11">g11</button>
  </div>
  <div>筆刷大小：<span id="bs">14</span> px</div>
  <input type="range" id="brush" min="4" max="60" value="14">
  <div class="row">
    <button id="undo">復原</button>
    <button id="reset">重置</button>
  </div>
  <button id="dl">產生 PNG</button>
  <div id="outWrap" style="display:none;border-top:1px solid #1e2a3a;padding-top:10px">
    <div class="hint" style="margin-bottom:6px">右鍵點圖片 →「另存圖片」</div>
    <a id="dlLink" download><img id="outImg" style="width:100%;border:1px solid #22303f;border-radius:6px;display:block"></a>
  </div>
</div>

const ZOOM = 4;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cur=8, img=new Image(), W=0, H=0, drawing=false, erase=true, snaps=[];

function load(id){
  cur=id; img=new Image();
  img.onload=()=>{ W=img.width;H=img.height; cv.width=W*ZOOM; cv.height=H*ZOOM;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,W*ZOOM,H*ZOOM);
    snaps=[]; };
  img.src = SRC[id];
}
function snapshot(){
  snaps.push(ctx.getImageData(0,0,cv.width,cv.height));
  if (snaps.length>25) snaps.shift();
}
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left), y:(e.clientY-r.top)};}
cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('mousedown', e=>{
  snapshot();
  drawing=true;
  erase = !(e.button===2 || e.shiftKey);
  paint(pos(e));
});
window.addEventListener('mousemove', e=>{ if(drawing) paint(pos(e)); });
window.addEventListener('mouseup', ()=>{ drawing=false; });

function paint(p){
  const r = +document.getElementById('brush').value * ZOOM/2;
  ctx.save();
  ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
document.getElementById('brush').addEventListener('input', e=>{
  document.getElementById('bs').textContent = e.target.value;
});
