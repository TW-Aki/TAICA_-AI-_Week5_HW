<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>ν 鋼彈 部件組裝編輯器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; height: 100vh; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #0b1018; color: #c8d6e5;
  }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0b1018; }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #panel {
    width: 320px; background: #111823; border-left: 1px solid #1e2a3a;
    display: flex; flex-direction: column; font-size: 13px;
  }
  #panel h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid #1e2a3a; color: #7fd4ff; }
  .hint { padding: 10px 16px; color: #6b8199; font-size: 12px; line-height: 1.6; border-bottom: 1px solid #1e2a3a; }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; user-select: none;
  }
  .item:hover { background: #17202c; }
  .item.sel { background: #1d3550; outline: 1px solid #2f6fa8; }
  .item .nm { flex: 1; }
  .item .z { color: #5d738c; font-size: 11px; }
  .item.hidden { opacity: 0.35; }
  #props { padding: 10px 16px; border-top: 1px solid #1e2a3a; display: none; }
  #props.on { display: block; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row label { width: 44px; color: #7b90a6; }
  .row input[type=number] { width: 78px; background: #0c121b; border: 1px solid #22303f; color: #cfe0f0; padding: 4px 6px; border-radius: 4px; }
  .row input[type=range] { flex: 1; }
  #actions { padding: 12px 16px; border-top: 1px solid #1e2a3a; display: flex; gap: 8px; }
  button {
    flex: 1; background: #1b2a3c; color: #9fd0f0; border: 1px solid #2b4056;
    padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #24405c; }
  #out { width: 100%; height: 150px; margin-top: 8px; background: #0c121b; color: #7fd4ff;
         border: 1px solid #22303f; border-radius: 6px; padding: 8px; font-family: monospace;
         font-size: 11px; display: none; }
  #out.on { display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="panel">
  <h1>ν 鋼彈 部件組裝</h1>
  <div class="hint">
    拖曳移動　滾輪縮放　Q / E 旋轉<br>
    F 水平翻轉　[ ] 調整層級<br>
    方向鍵微調（Shift = 10px）
  </div>
  <div id="list"></div>
  <div id="props">
    <div class="row"><label>X</label><input type="number" id="px" step="1"></div>
    <div class="row"><label>Y</label><input type="number" id="py" step="1"></div>
    <div class="row"><label>縮放</label><input type="range" id="psc" min="0.2" max="1.6" step="0.01"><input type="number" id="pscn" step="0.01" style="width:64px"></div>
    <div class="row"><label>旋轉</label><input type="range" id="prot" min="-180" max="180" step="1"><input type="number" id="protn" step="1" style="width:64px"></div>
  </div>
  <div id="actions">
    <button id="btnExport">匯出 JSON</button>
    <button id="btnReset">重設</button>
  </div>
  <div id="actions" style="border-top:none;padding-top:0">
    <button id="btnRef">顯示參考圖</button>
  </div>
  <textarea id="out" readonly></textarea>
</div>

const ORDER = ['backpack', 'hip', 'waist', 'chest', 'shoulder', 'shoulder2', 'head', 'rifle', 'shield'];
const LABEL = {
  backpack: '背包＋感應砲', hip: '髖部', waist: '腰／裙甲', chest: '胸部',
  shoulder: '左肩甲', shoulder2: '右肩甲', head: '頭部', rifle: '光束步槍', shield: '盾牌'
};
const INIT = {
  backpack:  { x: 148, y: 138, sc: 0.64, rot: -6, flip: false },
  hip:       { x: 168, y: 415, sc: 0.64, rot: 0,  flip: false },
  waist:     { x: 165, y: 348, sc: 0.70, rot: 0,  flip: false },
  chest:     { x: 163, y: 280, sc: 0.70, rot: 0,  flip: false },
  shoulder:  { x: 100, y: 264, sc: 0.64, rot: 0,  flip: false },
  shoulder2: { x: 218, y: 264, sc: 0.64, rot: 0,  flip: true  },
  head:      { x: 163, y: 212, sc: 0.62, rot: 0,  flip: false },
  rifle:     { x: 100, y: 370, sc: 0.55, rot: 0,  flip: false },
  shield:    { x: 258, y: 288, sc: 0.58, rot: -10, flip: false }
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * ZOOM; cv.height = H * ZOOM;

let parts = [];         // 由下到上
let sel = null;
let dragging = false, dragOff = { x: 0, y: 0 };
let showRef = false;
const refImg = new Image();
refImg.src = REF_DATA;
const imgs = {};

function reset() {
  parts = ORDER.map(n => ({ name: n, ...INIT[n], visible: true }));
  sel = parts[parts.length - 1];
  syncUI();
  draw();
}

function loadImages(done) {
  let n = 0;
  ORDER.forEach(name => {
    const im = new Image();
    im.onload = () => { if (++n === ORDER.length) done(); };
    im.onerror = () => { if (++n === ORDER.length) done(); };
    im.src = PART_DATA[name];
    imgs[name] = im;
  });
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  // 背景格線
  ctx.fillStyle = '#0e141d';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = 'rgba(60,90,120,0.18)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x*ZOOM, 0); ctx.lineTo(x*ZOOM, cv.height); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y*ZOOM); ctx.lineTo(cv.width, y*ZOOM); ctx.stroke();
  }
  // 中線
  ctx.strokeStyle = 'rgba(90,140,190,0.35)';
  ctx.beginPath(); ctx.moveTo(W/2*ZOOM, 0); ctx.lineTo(W/2*ZOOM, cv.height); ctx.stroke();

  if (showRef && refImg.complete && refImg.naturalWidth) {
    ctx.globalAlpha = 0.45;
    ctx.drawImage(refImg, 0, 0, W*ZOOM, H*ZOOM);
    ctx.globalAlpha = 1;
  }

  for (const p of parts) {
    if (!p.visible) continue;
    const im = imgs[p.name];
    if (!im || !im.complete || !im.naturalWidth) continue;
    ctx.save();
    ctx.translate(p.x * ZOOM, p.y * ZOOM);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.scale(p.flip ? -p.sc : p.sc, p.sc);
    ctx.drawImage(im, -im.width/2, -im.height/2);
    ctx.restore();

    if (p === sel) {
      const w = im.width * p.sc * ZOOM, h = im.height * p.sc * ZOOM;
      ctx.save();
      ctx.translate(p.x*ZOOM, p.y*ZOOM);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.strokeStyle = '#4fb8ff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(-w/2, -h/2, w, h);
      ctx.restore();
    }
  }
}

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / ZOOM, y: (e.clientY - r.top) / ZOOM };
}

function pick(pt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (!p.visible) continue;
    const im = imgs[p.name];
    if (!im || !im.naturalWidth) continue;
    // 以旋轉後的矩形做粗略命中
    const dx = pt.x - p.x, dy = pt.y - p.y;
    const a = -p.rot * Math.PI/180;
    const lx = dx*Math.cos(a) - dy*Math.sin(a);
    const ly = dx*Math.sin(a) + dy*Math.cos(a);
    if (Math.abs(lx) < im.width*p.sc/2 && Math.abs(ly) < im.height*p.sc/2) return p;
  }
  return null;
}

cv.addEventListener('mousedown', e => {
  const pt = toCanvas(e);
  const hit = pick(pt);
  if (hit) {
    sel = hit;
    // 移到最上層
    parts.splice(parts.indexOf(hit), 1);
    parts.push(hit);
    dragging = true;
    dragOff = { x: pt.x - hit.x, y: pt.y - hit.y };
    cv.classList.add('dragging');
    syncUI(); draw();
  }
});

window.addEventListener('mousemove', e => {
  if (!dragging || !sel) return;
  const pt = toCanvas(e);
  sel.x = Math.round(pt.x - dragOff.x);
  sel.y = Math.round(pt.y - dragOff.y);
  syncProps(); draw();
});

window.addEventListener('mouseup', () => {
  dragging = false;
  cv.classList.remove('dragging');
});

cv.addEventListener('wheel', e => {
  if (!sel) return;
  e.preventDefault();
  sel.sc = Math.max(0.2, Math.min(1.6, sel.sc * (e.deltaY < 0 ? 1.04 : 0.96)));
  syncProps(); draw();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (!sel) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft')  { sel.x -= step; }
  else if (e.key === 'ArrowRight') { sel.x += step; }
  else if (e.key === 'ArrowUp')    { sel.y -= step; }
  else if (e.key === 'ArrowDown')  { sel.y += step; }
  else if (e.key === 'q' || e.key === 'Q') { sel.rot -= 2; }
  else if (e.key === 'e' || e.key === 'E') { sel.rot += 2; }
  else if (e.key === 'f' || e.key === 'F') { sel.flip = !sel.flip; }
  else if (e.key === '[') { moveZ(-1); }
  else if (e.key === ']') { moveZ(1); }
  else return;
  e.preventDefault();
  syncProps(); draw();
});

function moveZ(d) {
  const i = parts.indexOf(sel);
  const j = i + d;
  if (j < 0 || j >= parts.length) return;
  parts.splice(i, 1);
  parts.splice(j, 0, sel);
  syncUI();
}

function syncUI() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  [...parts].reverse().forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'item' + (p === sel ? ' sel' : '') + (p.visible ? '' : ' hidden');
    div.innerHTML = `<span class="nm">${LABEL[p.name]}</span><span class="z">z${parts.length - idx}</span>`;
    div.onclick = () => { sel = p; syncUI(); draw(); };
    list.appendChild(div);
  });
  syncProps();
}

function syncProps() {
  const box = document.getElementById('props');
  if (!sel) { box.classList.remove('on'); return; }
  box.classList.add('on');
  document.getElementById('px').value = sel.x;
  document.getElementById('py').value = sel.y;
  document.getElementById('psc').value = sel.sc;
  document.getElementById('pscn').value = sel.sc.toFixed(2);
  document.getElementById('prot').value = sel.rot;
  document.getElementById('protn').value = sel.rot;
}

['px','py'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    if (!sel) return;
    sel[id === 'px' ? 'x' : 'y'] = parseFloat(e.target.value) || 0;
    draw();
  });
});
document.getElementById('psc').addEventListener('input', e => {
  if (!sel) return; sel.sc = parseFloat(e.target.value);
  document.getElementById('pscn').value = sel.sc.toFixed(2); draw();
});
document.getElementById('pscn').addEventListener('input', e => {
  if (!sel) return; sel.sc = parseFloat(e.target.value) || 0.5;
  document.getElementById('psc').value = sel.sc; draw();
});
document.getElementById('prot').addEventListener('input', e => {
  if (!sel) return; sel.rot = parseFloat(e.target.value);
  document.getElementById('protn').value = sel.rot; draw();
});
document.getElementById('protn').addEventListener('input', e => {
  if (!sel) return; sel.rot = parseFloat(e.target.value) || 0;
  document.getElementById('prot').value = sel.rot; draw();
});

document.getElementById('btnReset').onclick = () => { reset(); };
document.getElementById('btnRef').onclick = (e) => {
  showRef = !showRef;
  e.target.textContent = showRef ? '隱藏參考圖' : '顯示參考圖';
  draw();
};

document.getElementById('btnExport').onclick = () => {
  const out = {
    size: [W, H],
    placements: parts.filter(p => p.visible)
      .map(p => [p.name, p.x, p.y, +p.sc.toFixed(3), !!p.flip, p.rot])
  };
  const ta = document.getElementById('out');
  ta.classList.add('on');
  ta.value = JSON.stringify(out, null, 1);
  ta.select();
  try { document.execCommand('copy'); } catch (err) {}
};

loadImages(() => { reset(); });
</script>
</body>
</html>
