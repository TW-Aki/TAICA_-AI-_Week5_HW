const ZOOM=2.2;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0, pts=[], next=0;
const NAMES=['主砲','副砲'];
IMG.onload=()=>{W=IMG.width;H=IMG.height;cv.width=W*ZOOM;cv.height=H*ZOOM;
 document.getElementById('vs').textContent=W+'×'+H; draw();};
function draw(){
 ctx.fillStyle='#0e141d';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.drawImage(IMG,0,0,W*ZOOM,H*ZOOM);
 ctx.strokeStyle='rgba(60,90,120,0.25)';ctx.lineWidth=1;
 for(let x=0;x<=W;x+=20){ctx.beginPath();ctx.moveTo(x*ZOOM,0);ctx.lineTo(x*ZOOM,cv.height);ctx.stroke();}
 for(let y=0;y<=H;y+=20){ctx.beginPath();ctx.moveTo(0,y*ZOOM);ctx.lineTo(cv.width,y*ZOOM);ctx.stroke();}
 pts.forEach((p,i)=>{
   const col = i===0?'#ffd93d':'#ff6b6b';
   ctx.strokeStyle=col;ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(p.x*ZOOM-10,p.y*ZOOM);ctx.lineTo(p.x*ZOOM+10,p.y*ZOOM);ctx.stroke();
   ctx.beginPath();ctx.moveTo(p.x*ZOOM,p.y*ZOOM-10);ctx.lineTo(p.x*ZOOM,p.y*ZOOM+10);ctx.stroke();
   ctx.fillStyle=col;ctx.font='bold 13px system-ui';
   ctx.fillText(NAMES[i], p.x*ZOOM+12, p.y*ZOOM-8);
 });
}
cv.addEventListener('mousedown',e=>{
 const r=cv.getBoundingClientRect();
 const x=Math.round((e.clientX-r.left)/ZOOM), y=Math.round((e.clientY-r.top)/ZOOM);
 pts[next]= {x,y}; next=(next+1)%2;
 for (let k=0;k<2;k++){
   const el=document.getElementById('v'+(k+1));
   if (el) el.textContent = pts[k] ? pts[k].x+', '+pts[k].y : '-';
 }
 draw();
});
document.getElementById('btnCopy').onclick=()=>{
 const ta=document.getElementById('out');
 ta.value=JSON.stringify({size:[W,H], nozzles:pts.filter(Boolean)});
 ta.select(); try{document.execCommand('copy')}catch(e){}
};
</script></body></html>
