<style>
*{box-sizing:border-box}

<div id="left"><canvas id="cv"></canvas></div>
<div id="right">
  <h1>感應炮 頭尾設定</h1>
  <div class="hint">
    拖曳兩個圓點：<br>
    <b style="color:#ff6b6b">紅點</b> = 頭（光束射出口）<br>
    <b style="color:#4fb8ff">藍點</b> = 尾（推進器）<br>
    也可以直接點畫布放置目前選取的那個點。
  </div>
  <div class="legend">
    <span class="dot" style="background:#ff6b6b"></span>頭部 / 砲口<br>
    <span class="dot" style="background:#4fb8ff"></span>尾部 / 推進器<br>
    <span class="dot" style="background:#7dff9a"></span>朝向（垂直於頭尾連線）
  </div>
  <div style="margin-top:16px">
    <div class="row"><span>頭部座標</span><b id="vH">-</b></div>
    <div class="row"><span>尾部座標</span><b id="vT">-</b></div>
    <div class="row"><span>機身角度</span><b id="vA">-</b></div>
    <div class="row"><span>頭尾距離</span><b id="vL">-</b></div>
    <div class="row"><span>相對中心偏移</span><b id="vC">-</b></div>
  </div>
  <button id="btnCopy">匯出 JSON</button>
  <textarea id="out" readonly></textarea>
</div>

const ZOOM = 4;
let W=0,H=0;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// 預設值（原圖座標）
let head = {x: 112, y: 75};
let tail = {x: 12,  y: 55};
let active = 'head';
let drag = null;

IMG.onload = () => {
  W = IMG.width; H = IMG.height;
  cv.width = W*ZOOM; cv.height = H*ZOOM;
  draw();
};

function draw(){
  ctx.fillStyle = '#0e141d'; ctx.fillRect(0,0,cv.width,cv.height);
  // 格線
  ctx.strokeStyle = 'rgba(60,90,120,0.18)'; ctx.lineWidth = 1;
  for (let x=0;x<=W;x+=10){ ctx.beginPath(); ctx.moveTo(x*ZOOM,0); ctx.lineTo(x*ZOOM,cv.height); ctx.stroke(); }
  for (let y=0;y<=H;y+=10){ ctx.beginPath(); ctx.moveTo(0,y*ZOOM); ctx.lineTo(cv.width,y*ZOOM); ctx.stroke(); }

  ctx.drawImage(IMG, 0, 0, W*ZOOM, H*ZOOM);

  const hx = head.x*ZOOM, hy = head.y*ZOOM;
  const tx = tail.x*ZOOM, ty = tail.y*ZOOM;

  // 頭尾連線
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(tx,ty); ctx.stroke();

  // 朝向箭頭（由尾指向頭，延伸）
  const dx = hx-tx, dy = hy-ty, d = Math.hypot(dx,dy)||1;
  const ux = dx/d, uy = dy/d;
  const ex = hx + ux*90, ey = hy + uy*90;
  ctx.strokeStyle = '#7dff9a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-ux*14-uy*8, ey-uy*14+ux*8);
  ctx.lineTo(ex-ux*14+uy*8, ey-uy*14-ux*8);
  ctx.closePath(); ctx.fillStyle='#7dff9a'; ctx.fill();

  // 推進火焰示意（從尾點往後）
  const L = 40;
  const g = ctx.createLinearGradient(tx,ty, tx-ux*L, ty-uy*L);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.4,'rgba(150,220,255,0.6)');
  g.addColorStop(1,'rgba(80,160,255,0)');
  ctx.strokeStyle = g; ctx.lineWidth = 14; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-ux*L, ty-uy*L); ctx.stroke();

  // 點
  const dot = (x,y,color,label) => {
    ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(label, x+13, y+5);
  };
  dot(hx,hy,'#ff6b6b','頭');
  dot(tx,ty,'#4fb8ff','尾');

  // 數值
  const ang = Math.atan2(dy,dx) * 180/Math.PI;
  document.getElementById('vH').textContent = `${head.x}, ${head.y}`;
  document.getElementById('vT').textContent = `${tail.x}, ${tail.y}`;
  document.getElementById('vA').textContent = ang.toFixed(1) + '°';
  document.getElementById('vL').textContent = d.toFixed(1);
  const cx = W/2, cy = H/2;
  document.getElementById('vC').textContent = `${(head.x-cx).toFixed(0)}, ${(head.y-cy).toFixed(0)}`;
}

function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX-r.left)/ZOOM, y: (e.clientY-r.top)/ZOOM };
}
cv.addEventListener('mousedown', e => {
  const p = pos(e);
  const dh = Math.hypot(p.x-head.x, p.y-head.y);
  const dt = Math.hypot(p.x-tail.x, p.y-tail.y);
  if (dh < 8) { drag = 'head'; }
  else if (dt < 8) { drag = 'tail'; }
  else { // 點擊空白：放置目前選取的點
    if (active === 'head') head = {x: Math.round(p.x), y: Math.round(p.y)};
    else tail = {x: Math.round(p.x), y: Math.round(p.y)};
    drag = active;
  }
  draw();
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const p = pos(e);
  const pt = {x: Math.round(p.x), y: Math.round(p.y)};
  if (drag === 'head') head = pt; else tail = pt;
  draw();
});
window.addEventListener('mouseup', () => { drag = null; });

document.getElementById('btnCopy').onclick = () => {
  const dx = head.x-tail.x, dy = head.y-tail.y;
  const d = Math.hypot(dx,dy)||1;
  const data = {
    head: [head.x, head.y],
    tail: [tail.x, tail.y],
    angleDeg: +(Math.atan2(dy,dx)*180/Math.PI).toFixed(2),
    length: +d.toFixed(1),
    size: [W, H]
  };
  const ta = document.getElementById('out');
  ta.value = JSON.stringify(data);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
};
</script></body></html>
