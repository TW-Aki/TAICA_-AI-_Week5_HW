const ZOOM=2.0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0, pts=[], drag=-1;
IMG.onload=()=>{
  W=IMG.width;H=IMG.height; cv.width=W*ZOOM; cv.height=H*ZOOM;
  document.getElementById('vs').textContent=W+'×'+H;
  pts=[{x:Math.round(W*0.16),y:Math.round(H*0.5)},{x:Math.round(W*0.80),y:Math.round(H*0.5)}];
  show(); draw();
};
function show(){
  document.getElementById('v1').textContent = pts[0] ? Math.round(pts[0].x)+', '+Math.round(pts[0].y) : '-';
  document.getElementById('v2').textContent = pts[1] ? Math.round(pts[1].x)+', '+Math.round(pts[1].y) : '-';
}
function draw(){
  ctx.fillStyle='#0e141d';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(IMG,0,0,W*ZOOM,H*ZOOM);
  const cols=['#ff6b6b','#4fb8ff'], names=['炮口','推進'];
  pts.forEach((p,i)=>{
    ctx.strokeStyle=cols[i]; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x*ZOOM-12,p.y*ZOOM); ctx.lineTo(p.x*ZOOM+12,p.y*ZOOM); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x*ZOOM,p.y*ZOOM-12); ctx.lineTo(p.x*ZOOM,p.y*ZOOM+12); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x*ZOOM,p.y*ZOOM,7,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=cols[i]; ctx.font='bold 13px system-ui';
    ctx.fillText(names[i], p.x*ZOOM+14, p.y*ZOOM-10);
  });
  // 連線
  if (pts.length===2){
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pts[0].x*ZOOM,pts[0].y*ZOOM); ctx.lineTo(pts[1].x*ZOOM,pts[1].y*ZOOM); ctx.stroke();
  }
}
function toCanvas(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/ZOOM, y:(e.clientY-r.top)/ZOOM};
}
cv.addEventListener('mousedown',e=>{
  const p=toCanvas(e);
  let best=-1, bd=1e9;
  pts.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){bd=d;best=i;}});
  if (bd < 30){ drag=best; }
  else { pts[best===-1?0:best]= {x:p.x,y:p.y}; }
  show(); draw();
});
window.addEventListener('mousemove',e=>{
  if (drag<0) return;
  const p=toCanvas(e);
  pts[drag]={x:Math.round(p.x), y:Math.round(p.y)};
  show(); draw();
});
window.addEventListener('mouseup',()=>{ drag=-1; });
document.getElementById('btnCopy').onclick=()=>{
  const ta=document.getElementById('out');
  ta.value=JSON.stringify({size:[W,H], muzzle:pts[0], thruster:pts[1]});
  ta.select(); try{document.execCommand('copy')}catch(e){}
};
</script></body></html>
