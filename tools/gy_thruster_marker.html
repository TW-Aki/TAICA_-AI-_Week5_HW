const ZOOM=3.2;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0, pts=[], next=0, drag=-1;
IMG.onload=()=>{ W=IMG.width;H=IMG.height; cv.width=W*ZOOM; cv.height=H*ZOOM;
  document.getElementById('vs').textContent=W+'×'+H; draw(); };
function show(){
  for (let k=0;k<3;k++){
    document.getElementById('v'+(k+1)).textContent = pts[k] ? Math.round(pts[k].x)+', '+Math.round(pts[k].y) : '-';
  }
}
function draw(){
  ctx.fillStyle='#0e141d';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(IMG,0,0,W*ZOOM,H*ZOOM);
  ctx.strokeStyle='rgba(60,90,120,0.25)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=20){ctx.beginPath();ctx.moveTo(x*ZOOM,0);ctx.lineTo(x*ZOOM,cv.height);ctx.stroke();}
  for(let y=0;y<=H;y+=20){ctx.beginPath();ctx.moveTo(0,y*ZOOM);ctx.lineTo(cv.width,y*ZOOM);ctx.stroke();}
  pts.forEach((p,i)=>{
    ctx.strokeStyle='#ff9f43'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x*ZOOM-12,p.y*ZOOM); ctx.lineTo(p.x*ZOOM+12,p.y*ZOOM); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x*ZOOM,p.y*ZOOM-12); ctx.lineTo(p.x*ZOOM,p.y*ZOOM+12); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x*ZOOM,p.y*ZOOM,8,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#ff9f43'; ctx.font='bold 13px system-ui';
    ctx.fillText(['上','下','中'][i], p.x*ZOOM+14, p.y*ZOOM-10);
  });
}
function toCanvas(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/ZOOM, y:(e.clientY-r.top)/ZOOM};}
cv.addEventListener('mousedown',e=>{
  const p=toCanvas(e);
  let best=-1, bd=1e9;
  pts.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){bd=d;best=i;}});
  if (bd < 24) drag=best;
  else { pts[next]={x:Math.round(p.x),y:Math.round(p.y)}; next=(next+1)%3; }
  show(); draw();
});
window.addEventListener('mousemove',e=>{
  if (drag<0) return;
  const p=toCanvas(e); pts[drag]={x:Math.round(p.x),y:Math.round(p.y)}; show(); draw();
});
window.addEventListener('mouseup',()=>{ drag=-1; });
document.getElementById('btnCopy').onclick=()=>{
  const ta=document.getElementById('out');
  ta.value=JSON.stringify({size:[W,H], nozzles:pts.filter(Boolean)});
  ta.select(); try{document.execCommand('copy')}catch(e){}
};
</script></body></html>
